<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A Kingdom Made for Her</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant:wght@300;400;500;600&family=Italianno&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<style>
:root{
  --paper:#F3EEE4; --ivory:#E9E0D2; --ivory-d:#DDD3C1;
  --charcoal:#25231F; --forest:#243D35; --forest-d:#18291F;
  --ox:#6F2F2B; --brass:#A4854D; --graphite:#766F66;
  --hair:rgba(37,35,31,.13);
  --serif:'Cormorant Garamond',Georgia,serif;
  --disp:'Cormorant',Georgia,serif;
  --script:'Italianno',cursive;
  --sans:'Inter',system-ui,sans-serif;
  font-size:18px;
}
@media(max-width:760px){:root{font-size:17px}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--serif);background:var(--paper);color:var(--charcoal);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.62;font-size:1rem}
::selection{background:var(--forest);color:var(--paper)}
::-webkit-scrollbar{width:0}
img{display:block;max-width:100%}
canvas{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--forest);outline-offset:3px}

#grain{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.4;mix-blend-mode:multiply}

/* ─── type ─── */
.kicker{font-family:var(--disp);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--graphite)}
.ttl{font-family:var(--disp);font-weight:400;font-size:clamp(1.7rem,3.2vw,2.4rem);
  letter-spacing:.06em;line-height:1.2;color:var(--charcoal)}
.script{font-family:var(--script);color:var(--graphite);line-height:1.2}
.orn{display:flex;align-items:center;justify-content:center;gap:.5rem}
.orn i{height:1px;background:var(--brass);opacity:.5;flex:1;max-width:42px}
.orn svg{flex-shrink:0;color:var(--brass)}
.torn-l{clip-path:polygon(4% 0,100% 0,100% 100%,3% 100%,1% 94%,4.5% 87%,1.5% 80%,5% 73%,2% 66%,5.5% 59%,2% 52%,6% 45%,2.5% 38%,5.5% 31%,2% 24%,5% 17%,2% 10%)}

/* ═══════ COVER ═══════ */
#cover{display:grid;grid-template-columns:1.02fr 1.08fr;min-height:78vh;position:relative;background:var(--paper)}
.cov-left{padding:5rem 4rem;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;position:relative;z-index:2}
.bot{position:absolute;pointer-events:none;color:var(--charcoal);opacity:.17}
.bot-a{left:1.4rem;top:12%;width:118px}
.bot-b{left:2rem;bottom:8%;width:92px}
.stagmark{margin-bottom:1.8rem;opacity:0}
.cov-t1{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,4.2vw,3.2rem);
  letter-spacing:.16em;text-transform:uppercase;color:var(--forest);line-height:1.06;display:block;opacity:0}
.cov-t2{font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(1.35rem,2.9vw,2.1rem);color:var(--forest);display:block;margin-top:.12em;opacity:0}
.cov-orn{margin:1.3rem auto 1.6rem;max-width:158px;opacity:0}
.cov-sub{font-size:1rem;line-height:1.7;color:var(--charcoal);max-width:26ch;opacity:0}
.cov-cta{margin-top:2rem;background:var(--forest);border:1px solid var(--forest);cursor:pointer;
  font-family:var(--disp);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--paper);padding:1rem 2.5rem;transition:background .35s,color .35s;opacity:0}
.cov-cta:hover{background:transparent;color:var(--forest)}
.cov-star{margin-top:1.5rem;opacity:0;color:var(--brass)}
.cov-right{position:relative;overflow:hidden;background:linear-gradient(160deg,#2A2823,#3A362C 46%,#4B4335)}
.cov-right>.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cov-right>.ph img{width:100%;height:100%;object-fit:cover}
.cov-right>.ph .empty{font-family:var(--sans);font-size:.62rem;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(243,238,228,.34)}
.cov-right::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 72% 60% at 44% 38%,rgba(222,208,180,.13),transparent 72%)}
.cov-note{position:absolute;top:7%;right:5%;width:154px;z-index:3;background:var(--paper);
  padding:1.5rem 1.15rem;box-shadow:0 16px 38px rgba(0,0,0,.32);transform:rotate(1.6deg);
  clip-path:polygon(0 2%,100% 0,98.5% 100%,1.5% 98%)}
.cov-note .script{font-size:1.4rem;text-align:left;color:var(--charcoal)}
.cov-frame{position:absolute;bottom:13%;right:6%;width:112px;z-index:3;background:var(--ivory);
  padding:.6rem;box-shadow:0 14px 32px rgba(0,0,0,.4);transform:rotate(-1.4deg)}
.cov-frame .in{border:1px solid rgba(37,35,31,.2);padding:.9rem .4rem;display:flex;
  align-items:center;justify-content:center;background:linear-gradient(170deg,#E9E3D6,#D6CEBD)}
.cov-small{position:absolute;bottom:21%;right:22%;width:104px;z-index:2;background:var(--ivory);
  padding:.38rem;box-shadow:0 12px 26px rgba(0,0,0,.38);transform:rotate(2.4deg)}
.cov-small .im{aspect-ratio:4/3;background:linear-gradient(150deg,#6E6355,#443C33);
  display:flex;align-items:center;justify-content:center}
.cov-small .im span{font-family:var(--sans);font-size:.44rem;letter-spacing:.16em;
  color:rgba(243,238,228,.45);text-transform:uppercase}

/* ═══════ CHAPTER INDEX ═══════ */
#chapters{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--hair);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.ch{background:var(--paper);border:none;cursor:pointer;text-align:center;
  padding:2.6rem 1.4rem 2rem;display:flex;flex-direction:column;align-items:center;
  transition:background .45s;font-family:var(--serif)}
.ch:hover{background:var(--ivory)}
.ch .num{font-family:var(--disp);font-size:.74rem;letter-spacing:.2em;color:var(--brass);margin-bottom:.7rem}
.ch h3{font-family:var(--disp);font-weight:400;font-size:1.06rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--charcoal);line-height:1.3;margin-bottom:.85rem}
.ch .orn{max-width:64px;margin-bottom:1rem}
.ch .blurb{font-size:.9rem;line-height:1.7;color:var(--graphite);margin-bottom:1.8rem;max-width:25ch}
.ch .art{width:100%;flex:1;min-height:210px;margin-bottom:1.3rem;display:flex;
  align-items:center;justify-content:center;position:relative;overflow:hidden}
.ch .lnk{font-family:var(--script);font-size:1.34rem;color:var(--graphite);
  display:flex;align-items:center;gap:.5rem;transition:color .3s}
.ch:hover .lnk{color:var(--forest)}
.ch .lnk .ar{display:block;width:34px;height:1px;background:currentColor;opacity:.55;
  position:relative;transition:width .35s}
.ch:hover .lnk .ar{width:44px}
.ch .lnk .ar::after{content:'';position:absolute;right:0;top:-2px;width:5px;height:5px;
  border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
/* card art */
.a-letter{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.a-paper{width:76%;aspect-ratio:3/4;background:linear-gradient(160deg,#E4DAC2,#D3C8AC);
  transform:rotate(-3deg);box-shadow:0 8px 22px rgba(37,35,31,.17);padding:1rem .9rem;
  clip-path:polygon(0 1%,100% 0,99% 99%,1% 100%)}
.a-paper .ln{height:1px;background:rgba(37,35,31,.18);margin-bottom:.4rem}
.a-arch{width:100%;height:100%;position:relative}
.a-ph{position:absolute;background:var(--paper);padding:.28rem;box-shadow:0 8px 20px rgba(37,35,31,.2)}
.a-ph .im{width:100%;height:100%}

/* ═══════ FOOTLINE ═══════ */
#footline{padding:3rem 2rem 3.4rem;text-align:center;position:relative}
#footline p{font-size:.98rem;line-height:1.8;color:var(--graphite)}
#footline .sig{font-family:var(--script);font-size:1.7rem;color:var(--charcoal);margin-top:.7rem;display:block}
#footline .more{margin-top:2.2rem;display:flex;justify-content:center;gap:2rem;flex-wrap:wrap}
#footline .more button{background:none;border:none;cursor:pointer;font-family:var(--disp);
  font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--graphite);
  padding-bottom:.35rem;border-bottom:1px solid var(--hair);transition:color .25s}
#footline .more button:hover{color:var(--forest)}

/* ═══════ PAGE VIEW ═══════ */
#page{position:fixed;inset:0;z-index:600;background:var(--paper);overflow-y:auto;display:none}
.pg-bar{position:sticky;top:0;z-index:8;background:rgba(243,238,228,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2.6rem}
.pg-back{background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:.68rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--graphite);display:flex;
  align-items:center;gap:.7rem;transition:color .25s}
.pg-back:hover{color:var(--forest)}
.pg-back .a{display:block;width:26px;height:1px;background:currentColor;position:relative}
.pg-back .a::after{content:'';position:absolute;left:0;top:-2px;width:5px;height:5px;
  border-bottom:1px solid currentColor;border-left:1px solid currentColor;transform:rotate(45deg)}
.pg-name{font-family:var(--disp);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--forest)}
.pg-nav{display:flex;gap:1.4rem}
.pg-nav button{background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:.64rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--graphite);transition:color .25s}
.pg-nav button:hover{color:var(--forest)}
.pg-nav button[disabled]{opacity:.25;cursor:default}
.pg-head{text-align:center;padding:5rem 2rem 0}
.pg-head .kicker{display:block;margin-bottom:.9rem}
.pg-head .orn{max-width:140px;margin:1.2rem auto 0}
.pg-in{padding:3.5rem 3rem 8rem;max-width:1180px;margin:0 auto}

/* letter page */
.lt-spread{display:grid;grid-template-columns:1fr .92fr;gap:5rem;align-items:center}
.lt-col{max-width:440px;margin:0 auto;position:relative}
.lt-col p{font-size:1rem;line-height:1.95;margin-bottom:1.35rem;color:var(--charcoal)}
.lt-sign{margin-top:1.8rem;display:block}
.lt-sign .a{display:block;font-size:1rem}
.lt-sign .m{font-family:var(--script);font-size:2.6rem;color:var(--charcoal);display:block;line-height:1;margin-top:.25rem}
.lt-rail{position:absolute;left:-4.5rem;top:0;font-family:var(--disp);font-size:.76rem;
  letter-spacing:.16em;color:var(--graphite);line-height:2;text-align:center}
.lt-art{position:relative;min-height:460px;background:linear-gradient(165deg,#2F3A2C,#46503A 50%,#5C6244);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.lt-art .empty{font-family:var(--sans);font-size:.6rem;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(243,238,228,.3)}
.lt-seal{position:absolute;top:6%;left:-30px;z-index:4}
.lt-note{position:absolute;bottom:9%;left:7%;width:170px;z-index:4;background:var(--paper);
  padding:1.4rem 1.1rem;box-shadow:0 16px 36px rgba(0,0,0,.3);transform:rotate(-1.8deg);
  clip-path:polygon(0 2%,100% 0,98.5% 100%,1.5% 98%)}
.lt-note .script{font-size:1.34rem;color:var(--charcoal)}

/* archive page */
.ar-grid{display:grid;grid-template-columns:1.32fr 1fr;gap:2.6rem;align-items:start}
.ar-main .fr{background:var(--ivory);border:1px solid var(--hair);aspect-ratio:4/3;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.ar-main .fr img{width:100%;height:100%;object-fit:cover}
.ar-main .fr .empty{font-family:var(--sans);font-size:.6rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--graphite)}
.ar-cap{margin-top:1.1rem;text-align:center}
.ar-cap .it{font-style:italic;font-size:.95rem;color:var(--graphite);display:block}
.ar-cap .script{font-size:1.24rem;display:block;margin-top:.15rem}
.ar-scatter{position:relative;min-height:380px}
.ar-note{position:absolute;right:0;top:-1.6rem;width:132px;text-align:right;z-index:5}
.ar-note .script{font-size:1.3rem}
.pol{position:absolute;background:var(--paper);padding:.4rem .4rem 1.5rem;
  box-shadow:0 10px 26px rgba(37,35,31,.22);cursor:pointer;transition:transform .4s,box-shadow .4s}
.pol:hover{transform:scale(1.04) rotate(0deg)!important;box-shadow:0 16px 38px rgba(37,35,31,.3);z-index:9}
.pol .im{width:100%;aspect-ratio:1/1;overflow:hidden}
.pol .im img{width:100%;height:100%;object-fit:cover}
.ar-add{text-align:center;margin-top:3rem}
.ar-add button{background:none;border:none;cursor:pointer;font-family:var(--disp);font-size:.66rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--graphite);padding-bottom:.35rem;
  border-bottom:1px solid var(--hair);transition:color .25s}
.ar-add button:hover{color:var(--forest)}
#photo-input{display:none}
#extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.5rem;margin-top:2.6rem}
#extra .pol{position:static;transform:none!important}

/* map page */
#map-svg{width:100%;height:auto}
.mp{cursor:pointer}
.mp circle.d{fill:var(--ox);transition:r .3s}
.mp:hover circle.d,.mp.on circle.d{r:5}
.mp circle.h{fill:none;stroke:var(--ox);stroke-width:.8;opacity:0;transition:opacity .3s}
.mp:hover circle.h,.mp.on circle.h,.mp:focus-visible circle.h{opacity:.5}
.mp-l{font-family:var(--script);font-size:20px;fill:var(--ox)}
.mp-s{font-family:var(--serif);font-size:12px;fill:var(--graphite)}
.mp-foot{display:flex;justify-content:space-between;align-items:flex-start;margin-top:1.6rem;gap:3rem}
.mp-foot .script{font-size:1.3rem;line-height:1.35;flex-shrink:0}
.mp-read{max-width:460px;text-align:right;min-height:84px}
.mp-read .rt{font-style:italic;font-size:1.28rem;color:var(--forest);margin-bottom:.4rem}
.mp-read .rb{font-size:.94rem;line-height:1.72;color:var(--graphite)}

/* constellation page */
.cn-stage{display:grid;grid-template-columns:1.5fr .82fr;gap:3rem;align-items:center}
.cn-wrap{position:relative}
#cn-svg{position:absolute;inset:0;width:100%;height:100%}
.st{cursor:pointer}
.st circle.s{fill:#D8C08A;transition:r .3s,fill .3s}
.st:hover circle.s,.st.on circle.s,.st:focus-visible circle.s{r:4.6;fill:#F4E9CE}
.st text{font-family:var(--serif);font-size:16px;fill:rgba(243,238,228,.9);letter-spacing:.05em}
.cn-card{background:var(--paper);padding:2rem 1.6rem;box-shadow:0 18px 44px rgba(0,0,0,.4);
  transform:rotate(1.2deg);position:relative;clip-path:polygon(0 1.5%,100% 0,99% 100%,1% 98.5%)}
.cn-card::before{content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:66px;height:24px;background:rgba(164,133,77,.3);border:1px solid rgba(164,133,77,.28)}
.cn-card .ct{font-family:var(--disp);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  text-align:center;margin-bottom:1rem;color:var(--charcoal)}
.cn-card .cb{font-size:.96rem;line-height:1.8;color:var(--graphite)}
.cn-hint{text-align:center;margin-top:2rem;font-style:italic;font-size:.94rem;color:rgba(243,238,228,.45)}

/* fireheart page */
.fh-spread{display:grid;grid-template-columns:1fr 1.06fr;gap:4.5rem;align-items:center}
.fh-txt p{font-size:1.02rem;line-height:1.9;margin-bottom:1.25rem;color:var(--charcoal)}
.fh-txt p.hi{color:var(--ox);font-style:italic}
.fh-art{position:relative;min-height:520px;overflow:hidden;background:var(--ivory)}
#fh-canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fh-note{position:absolute;top:9%;right:5%;width:142px;text-align:right;z-index:4}
.fh-note .script{font-size:1.32rem;color:var(--charcoal)}
.fh-crest{position:absolute;top:6%;left:6%;color:var(--brass);opacity:.6;z-index:4}

/* library */
.lb-shelf{display:flex;align-items:flex-end;justify-content:center;gap:.5rem;margin-top:2.6rem;flex-wrap:wrap}
.bk{width:84px;border-radius:1px 3px 3px 1px;padding:1.4rem .6rem;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;box-shadow:2px 4px 14px rgba(0,0,0,.3);
  transition:transform .45s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.bk:hover{transform:translateY(-14px)}
.bk::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 22%,transparent 78%,rgba(0,0,0,.28))}
.bk .t{font-family:var(--disp);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(243,238,228,.95);line-height:1.35;text-align:center;position:relative;z-index:2}
.bk .a{font-family:var(--disp);font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(243,238,228,.62);line-height:1.4;position:relative;z-index:2}
.bk .o{color:rgba(212,186,132,.85);position:relative;z-index:2}
.lb-plank{height:9px;background:linear-gradient(180deg,#6B5B44,#4A3E2E);max-width:800px;
  margin:0 auto;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.lb-foot{margin-top:2.2rem;text-align:center}
.lb-foot .script{font-size:1.36rem}

/* marginalia */
.mg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6rem;margin-top:2rem}
.mg-c{background:var(--ivory);padding:2.6rem 1.7rem 2.1rem;position:relative;
  box-shadow:0 10px 26px rgba(37,35,31,.14);text-align:center}
.mg-c:nth-child(1){transform:rotate(-1.4deg)}
.mg-c:nth-child(2){transform:rotate(.8deg);background:#E5DCC6}
.mg-c:nth-child(3){transform:rotate(-.6deg)}
.mg-c::before{content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:70px;height:26px;background:rgba(164,133,77,.28);border:1px solid rgba(164,133,77,.26)}
.mg-c .q{font-family:var(--script);font-size:1.6rem;line-height:1.35;color:var(--charcoal);margin-bottom:1rem}
.mg-c .ic{margin-top:1.2rem;color:var(--graphite);opacity:.45;display:flex;justify-content:center}
.mg-foot{margin-top:2.6rem;text-align:center}
.mg-foot .script{font-size:1.32rem}

/* soundtrack */
.st-spread{display:grid;grid-template-columns:1.04fr 1fr;gap:4rem;align-items:center}
.st-card{background:var(--ivory);padding:2.4rem 2.2rem;box-shadow:0 12px 30px rgba(37,35,31,.14);
  transform:rotate(-.8deg);max-width:420px}
.st-list{list-style:none;counter-reset:s}
.st-list li{font-family:var(--script);font-size:1.46rem;color:var(--graphite);line-height:1.75;
  counter-increment:s;display:flex;gap:.6rem}
.st-list li::before{content:counter(s) ".";flex-shrink:0}
.st-more{font-family:var(--script);font-size:1.32rem;color:var(--graphite);text-align:right;
  display:block;margin-top:1rem}
.st-art{position:relative;min-height:440px;overflow:hidden;
  background:linear-gradient(155deg,#3B3529,#524936 55%,#6A5C42);display:flex;
  align-items:center;justify-content:center}
.st-note{position:absolute;left:6%;bottom:8%;width:152px;z-index:4}
.st-note .script{font-size:1.32rem;color:rgba(243,238,228,.85)}

/* little things */
.lt-grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hair);
  border-left:1px solid var(--hair);margin-top:2rem}
.lt-cell{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);
  padding:2rem 1rem 1.7rem;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:1rem;transition:background .4s}
.lt-cell:hover{background:var(--ivory)}
.lt-cell .ic{color:var(--graphite);opacity:.8}
.lt-cell p{font-size:.88rem;line-height:1.55;color:var(--graphite)}

/* epilogue */
.ep-spread{display:grid;grid-template-columns:1.04fr 1fr;gap:4rem;align-items:center}
.ep-txt{text-align:center}
.ep-txt p{font-size:1rem;line-height:1.9;margin-bottom:1.3rem;color:var(--charcoal)}
.ep-sign .a{display:block;font-size:1rem}

  padding-bottom:.35rem;border-bottom:1px solid var(--hair)}
.ep-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:460px}
.ep-note{position:absolute;right:2%;bottom:8%;width:124px;text-align:right;z-index:4}
.ep-note .script{font-size:1.34rem}

/* lightbox */
#lb{position:fixed;inset:0;z-index:800;background:rgba(30,28,24,.95);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:1.6rem;
  opacity:0;pointer-events:none;transition:opacity .4s;padding:3rem}
#lb.open{opacity:1;pointer-events:all}
#lb img{max-width:84vw;max-height:72vh;object-fit:contain}
#lb-meta{text-align:center;max-width:46ch}
#lb-meta .t{font-family:var(--disp);font-size:.96rem;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(243,238,228,.92);margin-bottom:.5rem}
#lb-meta .d{font-family:var(--sans);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(243,238,228,.45);margin-bottom:.8rem}
#lb-meta .n{font-style:italic;font-size:.96rem;color:rgba(243,238,228,.7);line-height:1.7}
#lb-x{position:absolute;top:2rem;right:2.2rem;background:none;border:none;cursor:pointer;
  font-family:var(--disp);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(243,238,228,.6)}
#lb-x:hover{color:var(--paper)}

/* audio */
#audio{position:fixed;bottom:1.4rem;left:1.4rem;z-index:700;background:none;border:none;cursor:pointer;
  font-family:var(--disp);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--graphite);display:flex;align-items:center;gap:.5rem;transition:color .25s}
#audio:hover{color:var(--forest)}
#audio .mk{width:5px;height:5px;border-radius:50%;border:1px solid currentColor}
#audio.playing .mk{background:currentColor}

.rv{opacity:0}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .rv{opacity:1!important;transform:none!important}
}

@media(max-width:1180px){
  #chapters{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:1000px){
  #cover{grid-template-columns:1fr}
  .cov-right{min-height:52vh;order:-1}

<script>

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ORN_S = `<div class="orn" aria-hidden="true"><i></i><svg width="9" height="9" viewBox="0 0 9 9" fill="currentColor"><path d="M4.5 0 L5.6 3.4 L9 4.5 L5.6 5.6 L4.5 9 L3.4 5.6 L0 4.5 L3.4 3.4 Z"/></svg><i></i></div>`;
const STAG_SM = `<svg width="52" height="46" viewBox="0 0 88 76" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M44 66 C39.5 66 36.5 62 36 57 C35.6 52.5 37 47 39 43.5 C40.6 40.7 42.2 39 44 39 C45.8 39 47.4 40.7 49 43.5 C51 47 52.4 52.5 52 57 C51.5 62 48.5 66 44 66 Z"/><path d="M37 45 C33 43 29.5 43.5 27 45.5 M51 45 C55 43 58.5 43.5 61 45.5"/><path d="M39 40 C36.5 34 34 29 30 24 M36.6 32.6 C33 31 29.5 30.4 26 30.8 M30 24 C29 19.5 27.6 15.6 25.4 12"/><path d="M49 40 C51.5 34 54 29 58 24 M51.4 32.6 C55 31 58.5 30.4 62 30.8 M58 24 C59 19.5 60.4 15.6 62.6 12"/></svg>`;

/* seeded rng — art is stable between loads */
function mkRnd(s){let x=s;return()=>{x=(x*16807)%2147483647;return(x-1)/2147483646;};}

/* ═══════ COVER ENTRANCE ═══════ */
if(!REDUCED){

/* ═══════ CHAPTER INDEX ═══════ */
const INDEX=[

const CARD_ART={

/* ═══════ CARD ART ═══════ */
function cardMap(c){
  const x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  x.strokeStyle='rgba(37,35,31,.44)';x.lineWidth=1;x.lineCap='round';x.lineJoin='round';
  const rg=[[.10,.42,.20],[.34,.30,.24],[.60,.44,.20],[.20,.66,.18],[.62,.70,.16]];
  rg.forEach(([px,py,s])=>{
    const bx=px*W,by=py*H,w=s*W;
    x.beginPath();
    x.moveTo(bx,by);x.lineTo(bx+w*.34,by-w*.52);x.lineTo(bx+w*.56,by-w*.20);
    x.lineTo(bx+w*.74,by-w*.42);x.lineTo(bx+w,by);x.stroke();
    x.beginPath();x.moveTo(bx+w*.22,by);x.lineTo(bx+w*.36,by-w*.30);x.lineTo(bx+w*.50,by-w*.06);x.stroke();
  });
  x.strokeStyle='rgba(164,133,77,.8)';x.setLineDash([2,5]);x.lineWidth=1;
  x.beginPath();
  x.moveTo(W*.14,H*.36);x.bezierCurveTo(W*.34,H*.30,W*.52,H*.42,W*.72,H*.40);
  x.bezierCurveTo(W*.86,H*.39,W*.90,H*.56,W*.76,H*.66);
  x.bezierCurveTo(W*.58,H*.78,W*.36,H*.74,W*.28,H*.86);
  x.stroke();x.setLineDash([]);
  x.fillStyle='rgba(111,47,43,.85)';
  [[.14,.36],[.72,.40],[.76,.66],[.28,.86],[.44,.36]].forEach(([px,py])=>{
    x.beginPath();x.arc(px*W,py*H,2.6,0,7);x.fill();
  });
  // castle
  x.strokeStyle='rgba(37,35,31,.5)';
  const cx=W*.46,cy=H*.92,u=W*.024;
  x.beginPath();
  x.moveTo(cx,cy);x.lineTo(cx,cy-u*4);x.lineTo(cx+u,cy-u*4);x.lineTo(cx+u,cy-u*5.4);
  x.lineTo(cx+u*2,cy-u*5.4);x.lineTo(cx+u*2,cy-u*4);x.lineTo(cx+u*3.2,cy-u*4);
  x.lineTo(cx+u*3.2,cy-u*6.4);x.lineTo(cx+u*4.2,cy-u*6.4);x.lineTo(cx+u*4.2,cy-u*4);
  x.lineTo(cx+u*5.4,cy-u*4);x.lineTo(cx+u*5.4,cy-u*5.4);x.lineTo(cx+u*6.4,cy-u*5.4);
  x.lineTo(cx+u*6.4,cy-u*4);x.lineTo(cx+u*7.4,cy-u*4);x.lineTo(cx+u*7.4,cy);
  x.closePath();x.stroke();
  x.font=`italic ${Math.round(W*.042)}px 'Italianno',cursive`;
  x.fillStyle='rgba(111,47,43,.72)';
  x.fillText('where we met',W*.02,H*.26);
  x.fillText('the distance',W*.60,H*.60);
  x.fillText('where we are now',W*.20,H*.98);
}
function cardCon(c){
  const x=c.getContext('2d'),W=c.width,H=c.height,rnd=mkRnd(48271);
  x.clearRect(0,0,W,H);
  for(let i=0;i<1500;i++){
    const a=rnd()*Math.PI*2,d=Math.pow(rnd(),.4)*W*.42;
    const px=W/2+Math.cos(a)*d,py=H/2+Math.sin(a)*d*.94,r=W*.05*(.3+rnd());
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,'rgba(24,41,31,.05)');g.addColorStop(1,'rgba(24,41,31,0)');
    x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
  }
  const cx=W/2,cy=H*.5;
  const pts=[[.5,.24,'Books'],[.76,.40,'Dreams'],[.74,.70,'Kindness'],[.5,.84,'Jokes'],[.24,.70,'Songs'],[.24,.40,'Art']];
  x.strokeStyle='rgba(212,186,132,.5)';x.lineWidth=.9;
  pts.forEach(p=>{x.beginPath();x.moveTo(cx,cy);x.lineTo(p[0]*W,p[1]*H);x.stroke();});
  x.save();x.translate(cx,cy);
  for(let i=0;i<8;i++){const len=i%2===0?W*.09:W*.04;x.rotate(Math.PI/4);
    x.beginPath();x.moveTo(0,0);x.lineTo(4,-len*.3);x.lineTo(0,-len);x.lineTo(-4,-len*.3);x.closePath();
    x.fillStyle=i%2===0?'rgba(244,233,206,.94)':'rgba(212,186,132,.6)';x.fill();}
  x.restore();
  pts.forEach(p=>{
    const px=p[0]*W,py=p[1]*H;
    const g=x.createRadialGradient(px,py,0,px,py,12);
    g.addColorStop(0,'rgba(244,233,206,.55)');g.addColorStop(1,'rgba(244,233,206,0)');
    x.fillStyle=g;x.beginPath();x.arc(px,py,12,0,7);x.fill();
    x.fillStyle='#F0E4C6';x.beginPath();x.arc(px,py,2.4,0,7);x.fill();
  });
  for(let i=0;i<120;i++){
    const a=rnd()*Math.PI*2,d=Math.pow(rnd(),.5)*W*.38;
    x.fillStyle=`rgba(244,233,206,${.1+rnd()*.42})`;
    x.beginPath();x.arc(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d*.94,rnd()*.9,0,7);x.fill();
  }
  x.textAlign='center';x.fillStyle='rgba(243,238,228,.9)';
  x.font=`${Math.round(W*.042)}px 'Cormorant Garamond',serif`;
  pts.forEach(p=>{const oy=p[1]<.5?-14:22;x.fillText(p[2],p[0]*W,p[1]*H+oy);});
}
function cardFire(c){ paintFire(c, 20260615, true); }

/* Fireheart artwork — ink + oxblood wash + brass veins. No sword, no flame, no figure. */
function paintFire(c,seed,compact){
  const x=c.getContext('2d'),W=c.width,H=c.height,rnd=mkRnd(seed);
  x.fillStyle='#EFEADF';x.fillRect(0,0,W,H);
  function wash(cx,cy,rad,rgb,al,n,sy){
    for(let i=0;i<n;i++){
      const a=rnd()*Math.PI*2,d=Math.pow(rnd(),.48)*rad;
      const px=cx+Math.cos(a)*d,py=cy+Math.sin(a)*d*(sy||1),r=rad*.13*(.3+rnd());
      const g=x.createRadialGradient(px,py,0,px,py,r);
      g.addColorStop(0,`rgba(${rgb},${al})`);g.addColorStop(1,`rgba(${rgb},0)`);
      x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();
    }
  }
  const n=compact?1:1.5;
  wash(W*.42,H*.40,W*.44,'26,28,25',.030,900*n,1.2);
  wash(W*.56,H*.54,W*.38,'34,34,30',.024,700*n,1.15);
  wash(W*.32,H*.28,W*.30,'48,48,42',.015,450*n,1.1);
  wash(W*.72,H*.72,W*.34,'111,47,43',.026,650*n,1.05);
  wash(W*.84,H*.86,W*.24,'88,30,28',.030,400*n,1);
  x.lineCap='round';
  for(let k=0;k<4;k++){
    let px=W*(.04+rnd()*.1),py=H*(.40+k*.09);
    x.beginPath();x.moveTo(px,py);
    for(let i=0;i<10;i++){
      const nx=px+W*(.08+rnd()*.07),ny=py+H*(.02+rnd()*.05)+(rnd()-.5)*H*.04;
      x.quadraticCurveTo(px+(nx-px)*.5,py+(rnd()-.5)*H*.05,nx,ny);px=nx;py=ny;
    }
    x.strokeStyle=`rgba(164,133,77,${.6-k*.12})`;x.lineWidth=(compact?1.8:2.6)-k*.4;x.stroke();
    x.strokeStyle=`rgba(216,192,138,${.42-k*.09})`;x.lineWidth=(compact?.7:1)-k*.12;x.stroke();
  }
  for(let i=0;i<(compact?140:220);i++){
    const px=rnd()*W,py=H*.2+rnd()*H*.75;
    x.fillStyle=`rgba(26,28,25,${.015+rnd()*.07})`;
    x.beginPath();x.arc(px,py,rnd()*1.6,0,7);x.fill();
  }
  // faint mountain ridge — line drawing, per spec
  x.strokeStyle='rgba(37,35,31,.24)';x.lineWidth=1;x.lineJoin='round';
  x.beginPath();
  x.moveTo(0,H*.92);x.lineTo(W*.10,H*.80);x.lineTo(W*.17,H*.87);
  x.lineTo(W*.26,H*.75);x.lineTo(W*.36,H*.92);x.stroke();
  x.beginPath();x.moveTo(W*.07,H*.92);x.lineTo(W*.14,H*.84);x.lineTo(W*.20,H*.90);x.stroke();
}
function paintCards(){
  document.querySelectorAll('.card-canvas').forEach(c=>{
    if(c.dataset.done)return; c.dataset.done='1';
    const a=c.dataset.art;
    if(a==='map')cardMap(c); else if(a==='con')cardCon(c); else cardFire(c);
  });
}
paintCards();

/* ═══════ REVEALS ═══════ */
function reveal(scope){
  (scope||document).querySelectorAll('.rv').forEach(el=>{
    if(REDUCED){gsap.set(el,{opacity:1});return;}
    gsap.fromTo(el,{opacity:0,y:22},{opacity:1,y:0,duration:1.2,ease:'power3.out',
      scrollTrigger:{trigger:el,start:'top 92%',once:true,scroller:scope||undefined}});
  });
}
if(!REDUCED){
  gsap.fromTo('.ch',{opacity:0,y:26},{opacity:1,y:0,duration:1.1,stagger:.09,ease:'power3.out',
    scrollTrigger:{trigger:'#chapters',start:'top 90%',once:true}});
  gsap.fromTo('#footline',{opacity:0},{opacity:1,duration:1.2,
    scrollTrigger:{trigger:'#footline',start:'top 94%',once:true}});
}

   ].map(([p,t])=>`<div class="lt-cell"><span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">${p}</svg></span><p>${t}</p></div>`).join('')}
  </div>`},

 epilogue:{k:'The End For Now',t:'But Not Really',html:()=>`

   <div class="ep-art">
    <svg viewBox="0 0 360 400" fill="none" stroke="rgba(37,35,31,.42)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="max-width:80%" aria-hidden="true">

};
const ORDER=['letter','archive','map','constellation','fireheart','library','marginalia','soundtrack','little','epilogue'];
let current=null, lastFocus=null;

function openPage(k){
  const p=PAGES[k]; if(!p) return;
  current=k; lastFocus=document.activeElement;
  document.getElementById('pg-name').textContent=p.t;
  document.getElementById('pg-head').innerHTML=
    `<span class="kicker">${p.k}</span><h2 class="ttl">${p.t}</h2>${ORN}`;
  document.getElementById('pg-in').innerHTML=p.html();
  const i=ORDER.indexOf(k);
  document.getElementById('pg-prev').disabled=i<=0;
  document.getElementById('pg-next').disabled=i>=ORDER.length-1;
  const v=document.getElementById('page');
  v.style.display='block'; v.scrollTop=0;
  lenis.stop(); document.body.style.overflow='hidden';
  if(!REDUCED){
    gsap.fromTo(v,{opacity:0},{opacity:1,duration:.55,ease:'power2.out'});
    gsap.fromTo('#pg-head, #pg-in > *',{opacity:0,y:20},
      {opacity:1,y:0,duration:1,stagger:.07,delay:.1,ease:'power3.out'});
  }
  hydrate(k);
  document.getElementById('pg-back').focus();
  history.replaceState(null,'','#'+k);
}
function closePage(){
  const v=document.getElementById('page');
  const done=()=>{v.style.display='none';document.body.style.overflow='';lenis.start();current=null;
    if(lastFocus)lastFocus.focus();history.replaceState(null,'',location.pathname);};
  if(REDUCED){done();return;}
  gsap.to(v,{opacity:0,duration:.4,ease:'power2.in',onComplete:done});
}
document.getElementById('pg-back').addEventListener('click',closePage);
document.getElementById('pg-prev').addEventListener('click',()=>{
  const i=ORDER.indexOf(current); if(i>0) openPage(ORDER[i-1]);});
document.getElementById('pg-next').addEventListener('click',()=>{
  const i=ORDER.indexOf(current); if(i<ORDER.length-1) openPage(ORDER[i+1]);});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-open]'); if(b) openPage(b.dataset.open);});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.getElementById('lb').classList.contains('open')) closeLb();
  else if(current) closePage();
});

/* ═══════ PER-PAGE HYDRATION ═══════ */
function hydrate(k){
  if(k==='map'){
    const R={
      met:{t:'Where we met',b:'Replace this with the real place — the room, the street, the day of the week. The specific version always beats the poetic one.'},
      spoke:{t:'The first night we spoke properly',b:'Not the first time we talked. The first time it went past the surface and neither of us wanted it to end.'},
      realised:{t:'Where I realised',b:'There was a moment it stopped being a question. Write down where you were standing.'},
      distance:{t:'The distance between us',b:'Every map has a stretch that was harder to cross. This one was ours. Worth marking honestly.'},
      now:{t:'Where we are now',b:'Still being drawn. That is the point of leaving the edges open.'},
    };
    const pick=p=>{
      document.querySelectorAll('.mp').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
      const d=R[p.dataset.k],el=document.getElementById('mp-read');
      el.innerHTML=`<p class="rt">${d.t}</p><p class="rb">${d.b}</p>`;
      if(!REDUCED)gsap.fromTo(el,{opacity:0,y:8},{opacity:1,y:0,duration:.7,ease:'power3.out'});
    };
    document.querySelectorAll('.mp').forEach(p=>{
      p.addEventListener('click',()=>pick(p));
      p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(p);}});
    });
  }

  if(k==='constellation'){
    const S=[
      {x:450,y:118,n:'Books',t:'She finishes a book and carries it around for days afterwards. Ask her about the ending — she has a whole argument ready.'},
      {x:664,y:238,n:'Dreams',t:'She is ambitious in a quiet way. She would rather do the thing properly than tell you she is doing it.'},
      {x:648,y:432,n:'Kindness',t:'She has stayed gentle in a world that rewards the opposite, and I do not think she knows how rare that is.'},
      {x:450,y:540,n:'Jokes',t:'The private jokes that make no sense to anyone else. Half of them are one word long by now.'},
      {x:242,y:432,n:'Songs',t:'The songs she puts on when she works, and the completely different ones for when she does not want to think.'},
      {x:236,y:238,n:'Art',t:'She sees beauty others walk past. She turns feeling into something the world can hold.'},
    ];
    const c=document.getElementById('cn-canvas');
    const x=c.getContext('2d'),W=c.width,H=c.height,rnd=mkRnd(48271);
    const bg=x.createRadialGradient(W/2,H*.45,0,W/2,H*.45,W*.62);
    bg.addColorStop(0,'#22352A');bg.addColorStop(.55,'#16241B');bg.addColorStop(1,'#0F1811');
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    for(let i=0;i<420;i++){x.fillStyle=`rgba(238,228,204,${.05+rnd()*.4})`;
      x.beginPath();x.arc(rnd()*W,rnd()*H,rnd()*1.2,0,7);x.fill();}
    x.fillStyle='rgba(11,17,12,.85)';x.beginPath();x.moveTo(0,H);
    for(let px=0;px<=W;px+=14){const h=H-(22+rnd()*46);x.lineTo(px,h);x.lineTo(px+7,h+(10+rnd()*16));}
    x.lineTo(W,H);x.closePath();x.fill();
    const cx=W/2,cy=H*.5;
    x.strokeStyle='rgba(164,133,77,.22)';x.lineWidth=.8;
    [90,150,210,270].forEach(r=>{x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();});
    x.strokeStyle='rgba(164,133,77,.34)';
    S.forEach(s=>{x.beginPath();x.moveTo(cx,cy);x.lineTo(s.x,s.y);x.stroke();});
    x.save();x.translate(cx,cy);
    for(let i=0;i<8;i++){const len=i%2===0?76:34;x.rotate(Math.PI/4);
      x.beginPath();x.moveTo(0,0);x.lineTo(5,-len*.3);x.lineTo(0,-len);x.lineTo(-5,-len*.3);x.closePath();
      x.fillStyle=i%2===0?'rgba(244,233,206,.93)':'rgba(212,186,132,.62)';x.fill();}
    const gl=x.createRadialGradient(0,0,0,0,0,60);
    gl.addColorStop(0,'rgba(246,236,208,.5)');gl.addColorStop(1,'rgba(246,236,208,0)');
    x.fillStyle=gl;x.beginPath();x.arc(0,0,60,0,7);x.fill();x.restore();
    S.forEach(s=>{const g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,22);
      g.addColorStop(0,'rgba(242,230,200,.5)');g.addColorStop(1,'rgba(242,230,200,0)');
      x.fillStyle=g;x.beginPath();x.arc(s.x,s.y,22,0,7);x.fill();});
    const g=document.getElementById('cn-stars');
    S.forEach(s=>{
      const el=document.createElementNS('http://www.w3.org/2000/svg','g');
      el.setAttribute('class','st');el.setAttribute('tabindex','0');
      el.setAttribute('role','button');el.setAttribute('aria-label',s.n);
      const ty=s.y<300?s.y-26:s.y+34;
      el.innerHTML=`<circle class="s" cx="${s.x}" cy="${s.y}" r="3.4"/>
        <text x="${s.x}" y="${ty}" text-anchor="middle">${s.n}</text>`;
      const pick=()=>{
        document.querySelectorAll('.st').forEach(z=>z.classList.remove('on'));
        el.classList.add('on');
        document.getElementById('cn-ct').textContent=s.n;
        document.getElementById('cn-cb').textContent=s.t;
        if(!REDUCED)gsap.fromTo('#cn-card',{opacity:.35,y:8},{opacity:1,y:0,duration:.7,ease:'power3.out'});
      };
      el.addEventListener('click',pick);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
      g.appendChild(el);
    });
  }

  if(k==='fireheart') paintFire(document.getElementById('fh-canvas'),20260615,false);

  if(k==='library'){
    const B=[['Throne of<br/>Glass','#1B1E27'],['Crown of<br/>Midnight','#6B2A2A'],['Heir of<br/>Fire','#22402E'],
      ['Queen of<br/>Shadows','#59211E'],['Empire of<br/>Storms','#213450'],['Tower of<br/>Dawn','#1B293D'],
      ['Kingdom<br/>of Ash','#856632']];
    const s=document.getElementById('lb-shelf');
    B.forEach((b,i)=>{
      const d=document.createElement('div');d.className='bk';
      d.style.background=b[1];d.style.height=(200+((i*37)%22))+'px';
      d.innerHTML=`<span class="o"><svg width="13" height="13" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><path d="M7.5 0 L9 6 L15 7.5 L9 9 L7.5 15 L6 9 L0 7.5 L6 6 Z"/></svg></span>
        <span class="t">${b[0]}</span><span class="a">Sarah<br/>J. Maas</span>`;
      s.appendChild(d);
    });
  }

  if(k==='soundtrack'){
    const SONGS=['Holocene — Bon Iver','You Are the Reason — Calum Scott','Until I Found You — Stephen Sanchez',
      'Bloom — The Paper Kites','Sparks — Coldplay','Lover — Taylor Swift','The Night We Met — Lord Huron','505 — Arctic Monkeys'];
    const ul=document.getElementById('st-list');
    SONGS.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
  }

  if(k==='archive'){
    const META=[
      {t:'Her at work',d:'Add a date',m:'Photograph',n:'Replace this with the real moment — where you were, what she was making.'},
      {t:'Untitled study',d:'Add a date',m:'Add the medium',n:'A short note about this piece.'},
      {t:'Palette',d:'Add a date',m:'Photograph',n:'The colours she keeps returning to.'},
      {t:'Sketchbook',d:'Add a date',m:'Graphite on paper',n:'Unfinished, and better for it.'},
      {t:'In progress',d:'Add a date',m:'Add the medium',n:'The light was going and you said wait.'},
    ];
    document.querySelectorAll('[data-art-open]').forEach(el=>{
      el.setAttribute('tabindex','0');el.setAttribute('role','button');
      const meta=META[+el.dataset.artOpen]||META[0];
      const go=()=>{const img=el.querySelector('img');openLb(img?img.src:null,meta);};
      el.addEventListener('click',go);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    });
    const btn=document.getElementById('ar-add-btn'),inp=document.getElementById('photo-input');
    btn.addEventListener('click',()=>inp.click());
    inp.addEventListener('change',function(){
      const wrap=document.getElementById('extra');
      Array.from(this.files).forEach(f=>{
        const url=URL.createObjectURL(f);
        const d=document.createElement('div');d.className='pol';
        d.setAttribute('tabindex','0');d.setAttribute('role','button');
        d.innerHTML=`<div class="im"><img src="${url}" alt="Artwork from the archive"></div>`;
        const meta={t:'Untitled',d:'Add a date',m:'Add the medium',n:'Add a short note about this piece.'};
        d.addEventListener('click',()=>openLb(url,meta));
        d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb(url,meta);}});
        wrap.appendChild(d);
        if(!REDUCED)gsap.fromTo(d,{opacity:0,y:16},{opacity:1,y:0,duration:.9,ease:'power3.out'});
      });
      this.value='';
    });
  }

  if(k==='epilogue'){
    document.getElementById('ep-restart').addEventListener('click',()=>{
      closePage();
      setTimeout(()=>lenis.scrollTo(0,{duration:REDUCED?0:1.4}),320);
    });
  }
}

/* ═══════ LIGHTBOX ═══════ */
function openLb(src,meta){
  const lb=document.getElementById('lb'),img=document.getElementById('lb-img');
  if(src){img.src=src;img.style.display='block';}else{img.removeAttribute('src');img.style.display='none';}
  document.getElementById('lb-meta').innerHTML= meta
    ? `<div class="t">${meta.t}</div><div class="d">${meta.d} · ${meta.m}</div><div class="n">${meta.n}</div>` : '';
  lb.classList.add('open');
  document.getElementById('lb-x').focus();
}
function closeLb(){document.getElementById('lb').classList.remove('open');}
document.getElementById('lb-x').addEventListener('click',closeLb);
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});

/* ═══════ AUDIO (never autoplays) ═══════ */
const aud=new Audio('https://www.bensound.com/bensound-music/bensound-memories.mp3');
aud.loop=true;aud.volume=0;let audOn=false;
document.getElementById('audio').addEventListener('click',()=>{
  const b=document.getElementById('audio'),l=document.getElementById('audio-label');
  audOn=!audOn;b.classList.toggle('playing',audOn);
  if(audOn){aud.play().catch(()=>{});gsap.to(aud,{volume:.26,duration:REDUCED?0:2.2});l.textContent='Sound on';}
  else{gsap.to(aud,{volume:0,duration:REDUCED?0:1,onComplete:()=>aud.pause()});l.textContent='Sound';}
});

/* deep link */
const h=location.hash.replace('#','');
if(h&&PAGES[h]) setTimeout(()=>openPage(h),400);
