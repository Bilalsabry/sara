<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EEE4">
<title>A Kingdom Made for Her</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&family=Italianno&display=swap">
<link rel="stylesheet" href="assets/styles.css">

<!-- Animation is an enhancement: the page renders fully without it. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
<script defer type="module" src="assets/main.js"></script>
</head>

<body>

<!-- Restrained paper grain -->
<svg id="grain" aria-hidden="true" focusable="false">
  <filter id="grainFilter">
    <feTurbulence type="fractalNoise" baseFrequency=".84" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grainFilter)" opacity=".13"/>
</svg>

<!-- ══════════════════════════════════════════════════════════════════════
     COVER
     ══════════════════════════════════════════════════════════════════════ -->
<header class="cover" id="cover">
  <div class="cover__left">
    <span class="cover__botanical cover__botanical--stem"  id="cover-stem"  aria-hidden="true"></span>
    <span class="cover__botanical cover__botanical--sprig" id="cover-sprig" aria-hidden="true"></span>

    <div class="cover__mark anim-in" id="cover-mark" aria-hidden="true"></div>

    <h1 class="cover__title anim-in" id="cover-title">
      <span class="cover__title-top"    id="cover-title-top"></span>
      <span class="cover__title-bottom" id="cover-title-bottom"></span>
    </h1>

    <div class="cover__orn anim-in" id="cover-orn"></div>
    <p class="cover__blurb anim-in" id="cover-blurb"></p>

    <button class="cover__cta anim-in" id="cover-cta" type="button"></button>
    <div class="cover__star anim-in" id="cover-star" aria-hidden="true"></div>
  </div>

  <div class="cover__right">
    <div class="cover__photo" id="cover-photo"></div>
    <div class="cover__aside anim-in" id="cover-aside">
      <div class="cover__note"     id="cover-note"></div>
      <div class="cover__frame"    id="cover-frame"></div>
      <div class="cover__snapshot" id="cover-snapshot"></div>
    </div>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════════════════
     CONTENTS
     ══════════════════════════════════════════════════════════════════════ -->
<nav class="contents" id="contents" aria-label="Chapters"></nav>

<!-- ══════════════════════════════════════════════════════════════════════
     COLOPHON
     ══════════════════════════════════════════════════════════════════════ -->
<footer class="colophon" id="colophon">
  <p id="colophon-lines"></p>
  <span class="colophon__sig" id="colophon-sig"></span>

  <div class="colophon__more">
    <button type="button" data-open="library">The Library</button>
    <button type="button" data-open="marginalia">Marginalia</button>
    <button type="button" data-open="soundtrack">Soundtrack</button>
    <button type="button" data-open="little">The Little Things</button>
    <button type="button" data-open="notes">Notes From Me</button>
    <button type="button" data-open="epilogue">Epilogue</button>
  </div>

  <p class="colophon__credit" id="colophon-credit"></p>
</footer>

<!-- ══════════════════════════════════════════════════════════════════════
     READER — chapter overlay. Opaque before content animates.
     ══════════════════════════════════════════════════════════════════════ -->
<div class="reader" id="reader" role="dialog" aria-modal="true"
     aria-labelledby="reader-label" data-open="false">
  <div class="reader__bar">
    <button class="reader__back" id="reader-back" type="button">
      <i aria-hidden="true"></i> Back to the book
    </button>
    <span class="reader__label" id="reader-label"></span>
    <div class="reader__nav">
      <button id="reader-prev" type="button">Prev</button>
      <button id="reader-next" type="button">Next</button>
    </div>
  </div>
  <div class="reader__head" id="reader-head"></div>
  <div class="reader__body" id="reader-body"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════
     LIGHTBOX — warm cream, never a black modal
     ══════════════════════════════════════════════════════════════════════ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
     aria-label="Artwork detail" data-open="false">
  <button class="lightbox__close" id="lightbox-close" type="button">Close</button>
  <div class="lightbox__stage" id="lightbox-stage"></div>
  <div class="lightbox__meta"  id="lightbox-meta"></div>
  <div class="lightbox__controls">
    <button id="lightbox-prev" type="button">Previous</button>
    <button id="lightbox-next" type="button">Next</button>
  </div>
</div>

<!-- Sound: opt-in only, never autoplays -->
<button class="sound" id="sound" type="button" aria-pressed="false">
  <svg class="sound__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path class="sound__wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
  </svg>
  <span id="sound-label">Soundtrack: paused</span>
</button>

<noscript>
  <style>
    .chapter-link__cue, .cover__cta { display: none; }
    .noscript-note {
      max-width: 46ch; margin: 0 auto 4rem; padding: 1.2rem 1.4rem;
      border: 1px solid var(--rule); text-align: center;
      font-style: italic; color: var(--graphite);
    }
  </style>
  <p class="noscript-note">
    This book needs JavaScript to turn its pages. Please enable it to read on.
  </p>
</noscript>

</body>
</html>
